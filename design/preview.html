<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GUGU · 前端风格示例</title>
<link rel="stylesheet" href="tokens.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;padding:0}
input{font-family:inherit}
body{
  font-family:var(--font-ui);color:var(--text-1);min-height:100vh;overflow-x:auto;
  -webkit-font-smoothing:antialiased;
}
/* ---------- 桌面背景（模拟壁纸，衬托玻璃质感） ---------- */
.scene{position:fixed;inset:0;z-index:0;transition:background .4s;
  background:linear-gradient(180deg,var(--scene-a),var(--scene-b) 72%)}
.sun{position:absolute;right:17%;top:10%;width:190px;height:190px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,236,200,.95),rgba(255,236,200,0) 70%)}
[data-mode="dark"] .sun{width:120px;height:120px;
  background:radial-gradient(circle,rgba(214,226,255,.55),rgba(214,226,255,0) 70%)}
.hill{position:absolute;border-radius:50%;filter:blur(2px)}
.h1{left:-12%;bottom:-44%;width:78%;height:72%;background:var(--hill-1)}
.h2{right:-16%;bottom:-50%;width:88%;height:74%;background:var(--hill-2)}
.cloud{position:absolute;height:46px;border-radius:40px;background:rgba(255,255,255,.5);filter:blur(20px)}
.c1{left:11%;top:16%;width:230px}.c2{right:24%;top:29%;width:150px;height:38px}
[data-mode="dark"] .cloud{background:rgba(255,255,255,.045)}

/* ---------- 演示控制台（非产品 UI） ---------- */
.demo-bar{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:40;
  display:flex;align-items:center;gap:12px;white-space:nowrap;
  background:rgba(22,24,28,.80);backdrop-filter:blur(18px);color:#ECEDEE;
  padding:8px 16px;border-radius:14px;font-size:12px;
  box-shadow:0 8px 28px rgba(10,14,20,.30)}
body.clean .demo-bar{display:none}
.demo-bar .brand{font-weight:700;font-size:13px;letter-spacing:1px}
.demo-bar .brand i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#9AA0A6;margin-left:4px}
.demo-bar .sub{color:#9BA0A5}
.demo-bar .sep{width:1px;height:16px;background:rgba(255,255,255,.14)}
.pills{display:flex;gap:6px}
.pill{display:flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;color:#C9CCCF;border:1px solid transparent;transition:.2s}
.pill i{width:10px;height:10px;border-radius:50%;background:var(--pd)}
.pill:hover{color:#fff}
.pill.on{background:rgba(255,255,255,.14);color:#fff}
.seg{display:flex;background:rgba(255,255,255,.08);border-radius:8px;padding:2px}
.seg button{padding:3px 10px;border-radius:6px;color:#C9CCCF;font-size:11.5px}
.seg button.on{background:rgba(255,255,255,.16);color:#fff}
.ctl{display:flex;align-items:center;gap:7px;color:#C9CCCF}
.ctl input[type=range]{width:90px;accent-color:#B7BCC2}
.ctl b{font-weight:500;min-width:32px;color:#fff;font-variant-numeric:tabular-nums}
.ctl input[type=checkbox]{accent-color:#B7BCC2}
.hint{color:#8E9398;font-size:11px}
@media (max-width:1280px){.hint{display:none}}

/* ---------- 窗口基座：玻璃 ---------- */
.stage{position:relative;z-index:10;height:780px;margin-top:72px;min-width:1180px}
body.clean .stage{margin-top:26px}
.win{position:absolute;border-radius:var(--r-lg);background:var(--surface);
  backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5);
  border:1px solid var(--edge);box-shadow:var(--shadow-win);color:var(--text-1);
  user-select:none;transition:background .35s,border-color .35s;
  animation:rise .45s cubic-bezier(.22,.9,.36,1) both}
body.no-blur .win{backdrop-filter:none;-webkit-backdrop-filter:none}
body.no-blur{--glass-alpha:.97}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.drag{cursor:grab}
.drag:active{cursor:grabbing}

/* ---------- 桌面小部件 ---------- */
.widget{width:280px;right:56px;top:150px;padding:14px 14px 10px;animation-delay:.05s}
.w-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding:2px 2px 0}
.brand{font-weight:700;font-size:15px;letter-spacing:.5px;display:flex;align-items:center}
.brand i{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;margin-left:5px}
.w-nav{display:flex;align-items:center;gap:2px;font-size:12px;color:var(--text-2)}
.w-nav b{font-weight:500;min-width:66px;text-align:center;color:var(--text-1)}
.ghost{color:var(--text-3);width:20px;height:20px;border-radius:6px;font-size:13px;line-height:1}
.ghost:hover{background:var(--surface-2);color:var(--text-1)}
.mini-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px 0}
.mc-w{font-size:10.5px;color:var(--text-3);text-align:center;padding-bottom:5px}
.mc-d{height:30px;position:relative;text-align:center;font-size:12px;cursor:default}
.mc-d b{font-weight:400;display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 3px;border-radius:11px;font-variant-numeric:tabular-nums}
.mc-d.out b{color:var(--text-3);opacity:.45}
.mc-d.today b{background:var(--accent);color:var(--on-accent);font-weight:600}
.mc-dots{position:absolute;left:0;right:0;bottom:1px;display:flex;justify-content:center;gap:2px}
.mc-dots i{width:3.5px;height:3.5px;border-radius:50%;background:var(--tc)}
.w-div{height:1px;background:var(--hairline);margin:10px -14px}
.w-today-head{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;padding:0 2px 6px}
.w-today-head b{font-weight:600}
.w-count{color:var(--text-3);font-size:11px;font-variant-numeric:tabular-nums}
.w-row{display:flex;align-items:center;gap:8px;padding:5.5px 6px;border-radius:8px;font-size:12.5px}
.w-row:hover{background:var(--surface-2)}
.w-time{width:34px;color:var(--text-2);font-size:11.5px;font-variant-numeric:tabular-nums;flex:none}
.w-row.overdue .w-time{color:var(--danger);font-weight:600}
.w-title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w-gu{flex:none;font-size:9.5px;color:var(--danger);background:color-mix(in srgb,var(--danger) 13%,transparent);padding:1px 5px;border-radius:10px}
.w-more{font-size:11px;color:var(--text-3);padding:6px 6px 0}
.w-foot{font-size:10.5px;color:var(--text-3);padding:8px 2px 2px}

/* ---------- 复选框 ---------- */
.ck{width:16px;height:16px;border-radius:6px;border:1.5px solid var(--text-3);
  display:grid;place-items:center;cursor:pointer;flex:none;transition:all .2s;background:transparent}
.ck svg{width:10px;height:9px;stroke:var(--on-accent);stroke-width:2;fill:none;
  stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:16;stroke-dashoffset:16;
  transition:stroke-dashoffset .25s var(--ease-spring) .05s}
.ck:hover{border-color:var(--accent)}
.ck.on{background:var(--accent);border-color:var(--accent)}
.ck.on svg{stroke-dashoffset:0}
.ck.sm{width:14px;height:14px;border-radius:5px}
.ck.sm svg{width:8px;height:7px}

/* ---------- 唤出面板 ---------- */
.panel{width:480px;height:640px;left:96px;top:96px;display:flex;flex-direction:column;padding:14px 14px 0}
.p-top{padding-bottom:9px}
.quick{display:flex;align-items:center;gap:9px;background:var(--surface-2);
  border:1px solid var(--hairline);border-radius:var(--r-md);padding:9px 12px}
.quick:focus-within{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.q-plus{width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center;font-size:14px;line-height:1;flex:none;font-weight:500}
.quick input{flex:1;background:transparent;border:none;outline:none;font-size:13px;color:var(--text-1)}
.quick input::placeholder{color:var(--text-3)}
.enter-hint{font-size:10.5px;color:var(--text-3);border:1px solid var(--hairline);border-radius:5px;padding:1.5px 6px;flex:none}
.chips{display:flex;gap:6px;margin-top:8px;min-height:21px;flex-wrap:wrap;align-items:center}
.chip{font-size:11px;padding:2px 9px;border-radius:20px;background:var(--accent-weak);
  color:color-mix(in srgb,var(--accent) 72%,var(--text-1) 28%)}
.chip.tag{background:color-mix(in srgb,var(--tc) 15%,transparent);color:color-mix(in srgb,var(--tc) 75%,var(--text-1) 25%)}
.chip.pr{background:color-mix(in srgb,var(--danger) 13%,transparent);color:var(--danger)}
.chip.ttl{background:var(--surface-2);color:var(--text-2)}
.chip.ok{background:var(--accent-weak);color:var(--accent-deep)}
.tabs{display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--hairline);padding:0 2px}
.tabs button[data-tab]{padding:7px 13px;font-size:12.5px;color:var(--text-2);border-radius:8px 8px 0 0;position:relative}
.tabs button.on{color:var(--text-1);font-weight:600}
.tabs button.on::after{content:"";position:absolute;left:13px;right:13px;bottom:-1px;height:2px;border-radius:2px;background:var(--accent)}
.t-sp{flex:1}
.p-body{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;display:none}
.view.on{display:block}
.view::-webkit-scrollbar{width:4px}
.view::-webkit-scrollbar-thumb{background:var(--hairline);border-radius:4px}
.p-foot{border-top:1px solid var(--hairline);padding:8px 4px 9px;font-size:11px;color:var(--text-3);
  display:flex;justify-content:space-between;margin:0 -14px;padding-left:18px;padding-right:18px}

/* ---------- 今天：时间轴 ---------- */
.tl{position:relative;margin:4px 0 0}
.tl-hour{position:absolute;left:52px;right:8px;height:1px;background:var(--hairline)}
.tl-hour b{position:absolute;left:-46px;top:-6px;font-size:10px;color:var(--text-3);font-weight:400;
  width:38px;text-align:right;font-variant-numeric:tabular-nums}
.t-row{position:absolute;left:60px;right:8px}
.t-card{background:var(--surface-2);border:1px solid var(--hairline);border-left:2px solid transparent;
  border-radius:10px;padding:6px 10px;display:flex;align-items:center;gap:8px;min-height:30px}
.t-t{font-size:11px;color:var(--text-2);width:36px;flex:none;font-variant-numeric:tabular-nums}
.t-title{font-size:12.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tagpill{font-size:10px;padding:1.5px 8px;border-radius:20px;flex:none;
  background:color-mix(in srgb,var(--tc) 15%,transparent);
  color:color-mix(in srgb,var(--tc) 78%,var(--text-1) 22%)}
.bell{width:12px;height:12px;color:var(--text-3);flex:none}
.pill-over,.pill-gu{display:none;font-size:10px;padding:1.5px 7px;border-radius:20px;flex:none}
.pill-over{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.pill-gu{background:var(--accent-weak);color:color-mix(in srgb,var(--accent) 78%,var(--text-1) 22%)}
.t-row.overdue:not(.done) .pill-over{display:inline-flex}
.t-row.gugu .pill-gu{display:inline-flex}
.t-row.overdue:not(.done) .t-time{color:var(--danger);font-weight:600}
.t-row.overdue:not(.done) .t-card{border-left-color:var(--danger)}
.t-row.gugu .t-title{opacity:.6}
.t-row.gugu .t-time{color:var(--text-3)}
.t-act{display:none;gap:5px;flex:none}
.t-row:hover .t-act{display:flex}
.mini-btn{font-size:10.5px;padding:2.5px 9px;border-radius:7px;border:1px solid var(--hairline);color:var(--text-2);transition:.15s}
.mini-btn:hover{border-color:var(--text-3);color:var(--text-1)}
.mini-btn.ok{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.t-row.done .t-card{opacity:.5}
.t-row.done .t-title{color:var(--text-3);text-decoration:line-through;text-decoration-color:var(--text-3)}
.t-row.done .t-t{color:var(--text-3)}
.t-row.overdue:not(.done) .t-t{color:var(--danger);font-weight:600}
.nowline{position:absolute;left:52px;right:8px;height:0;border-top:1.5px solid var(--danger);z-index:3}
.nowline b{position:absolute;left:-50px;top:-9px;width:46px;text-align:center;font-size:10px;font-weight:600;
  color:var(--danger);background:var(--surface);border:1px solid color-mix(in srgb,var(--danger) 35%,transparent);
  padding:1px 0;border-radius:10px;font-variant-numeric:tabular-nums}
.nowline i{position:absolute;left:-3.5px;top:-3.5px;width:7px;height:7px;border-radius:50%;background:var(--danger);animation:pulse 2s infinite}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--danger) 45%,transparent)}
  70%{box-shadow:0 0 0 7px transparent}
  100%{box-shadow:0 0 0 0 transparent}}

/* ---------- 周 ---------- */
.wk{position:relative;height:452px;margin:6px 4px 0}
.wk-h{display:grid;grid-template-columns:44px repeat(7,1fr);font-size:11px;color:var(--text-2);text-align:center;padding-bottom:4px}
.wk-h b{font-weight:500;display:flex;flex-direction:column;align-items:center;gap:1px}
.wk-h b i{font-style:normal;font-size:10.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.wk-h b.today{color:var(--accent-deep);font-weight:600}
[data-mode="dark"] .wk-h b.today{color:var(--accent)}
.wk-body{position:absolute;left:44px;right:0;top:34px;bottom:6px;
  background-image:linear-gradient(to right,var(--hairline) 1px,transparent 1px);
  background-size:calc(100%/7) 100%}
.wl{position:absolute;left:0;right:0;height:1px;background:var(--hairline)}
.wl b{position:absolute;left:-40px;top:-6px;font-size:10px;color:var(--text-3);font-weight:400;
  width:32px;text-align:right;font-variant-numeric:tabular-nums}
.wk-chip{position:absolute;font-size:10px;line-height:1.3;padding:2.5px 5px;border-radius:6px;
  border-left:2px solid var(--tc);background:color-mix(in srgb,var(--tc) 13%,transparent);
  color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-chip.fin{opacity:.55;text-decoration:line-through}

/* ---------- 月 ---------- */
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:10px 2px 6px}
.mo-w{font-size:10.5px;color:var(--text-3);text-align:center;padding-bottom:2px}
.mo-d{height:54px;border-radius:10px;font-size:12px;position:relative;padding:5px 7px;
  background:var(--surface-2);border:1px solid transparent;cursor:default}
.mo-d b{font-weight:400;font-variant-numeric:tabular-nums}
.mo-d.out{opacity:.35}
.mo-d.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.mo-d.today b{color:var(--accent-deep);font-weight:600}
[data-mode="dark"] .mo-d.today b{color:var(--accent)}
.mo-d.sel{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.mo-dots{position:absolute;left:7px;bottom:6px;display:flex;gap:2.5px}
.mo-dots i{width:4px;height:4px;border-radius:50%;background:var(--tc)}
.month-list{padding:2px 2px 14px}
.ml-h{font-size:12px;font-weight:600;padding:6px 8px;color:var(--text-2)}
.ml-row{display:flex;align-items:center;gap:9px;font-size:12px;padding:6px 9px;border-radius:8px}
.ml-row:hover{background:var(--surface-2)}
.ml-row b{font-weight:400;color:var(--text-2);font-size:11px;width:38px;font-variant-numeric:tabular-nums}
.ml-row i{font-style:normal;font-size:10px;padding:1px 7px;border-radius:20px;flex:none;
  background:color-mix(in srgb,var(--tc) 15%,transparent);color:color-mix(in srgb,var(--tc) 78%,var(--text-1) 22%)}
.ml-empty{font-size:11.5px;color:var(--text-3);padding:8px 9px}

body.noanim *{animation:none!important;transition:none!important}
body{color-scheme:light}
[data-mode="dark"]{color-scheme:dark}
/* ---------- 新建任务小窗 ---------- */
.pop-mask{position:absolute;inset:0;z-index:6;border-radius:var(--r-lg);
  background:rgba(15,18,22,.28);display:none;align-items:flex-start;justify-content:center;padding-top:76px}
.pop-mask.on{display:flex}
.addpop{width:calc(100% - 32px);background:var(--solid);border:1px solid var(--hairline);
  border-radius:var(--r-md);box-shadow:0 18px 44px rgba(10,14,20,.22);padding:12px 14px 11px;
  animation:popin .18s cubic-bezier(.22,.9,.36,1) both}
@keyframes popin{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.f-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.f-head b{font-size:12.5px}
.frow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.f-label{font-size:11.5px;color:var(--text-2);width:30px;flex:none}
.f-in{flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--hairline);border-radius:8px;
  padding:6px 9px;font-size:12.5px;color:var(--text-1);outline:none;transition:border-color .15s}
.f-in:focus{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.f-in.time{flex:0 0 118px}
.f-in.sel{flex:0 0 128px}
.fdots{display:flex;gap:4px;flex-wrap:wrap}
.fdot{display:flex;align-items:center;gap:4px;font-size:10.5px;padding:2.5px 8px;border-radius:14px;
  border:1px solid transparent;color:var(--text-2);transition:.15s}
.fdot i{width:8px;height:8px;border-radius:50%;background:var(--tc)}
.fdot.on{background:color-mix(in srgb,var(--tc) 15%,transparent);
  border-color:color-mix(in srgb,var(--tc) 40%,transparent);
  color:color-mix(in srgb,var(--tc) 70%,var(--text-1) 30%)}
.f-foot{display:flex;justify-content:space-between;align-items:center;margin-top:9px}
.f-hint{font-size:10.5px;color:var(--text-3)}
.btn{font-size:12px;padding:6px 14px;border-radius:8px}
.btn.gho{border:1px solid var(--hairline);color:var(--text-2)}
.btn.gho:hover{color:var(--text-1);border-color:var(--text-3)}
.btn.pri{background:var(--accent);color:var(--on-accent);font-weight:500}
.btn.pri:hover{background:var(--accent-deep)}
@media (max-width:1180px){
  .stage{height:auto;min-width:0;display:flex;flex-wrap:wrap;gap:24px;justify-content:center;padding:90px 16px 40px}
  .win{position:static}
}
</style>
</head>
<body data-theme="celadon" data-mode="light">

<div class="scene" aria-hidden="true">
  <div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div>
  <div class="hill h1"></div><div class="hill h2"></div>
</div>

<header class="demo-bar" id="demoBar">
  <span class="brand">GUGU<i></i></span><span class="sub">前端风格示例</span>
  <span class="sep"></span>
  <div class="pills" id="themePills">
    <button class="pill on" data-theme-set="celadon"><i style="--pd:#3E9B7A"></i>青瓷绿</button>
    <button class="pill" data-theme-set="azure"><i style="--pd:#4A90D9"></i>天青蓝</button>
    <button class="pill" data-theme-set="tangerine"><i style="--pd:#E8956D"></i>蜜柑橘</button>
  </div>
  <span class="sep"></span>
  <div class="seg" id="modeSeg">
    <button class="on" data-mode-set="light">浅色</button><button data-mode-set="dark">深色</button>
  </div>
  <label class="ctl">透明度 <input type="range" id="alpha" min="0.5" max="0.95" step="0.01" value="0.8"><b id="alphaVal">80%</b></label>
  <label class="ctl"><input type="checkbox" id="blurChk" checked>毛玻璃</label>
  <span class="hint">窗口可拖动 · 输入框试试「明天15:00 交周报 #工作 !重要」</span>
</header>

<main class="stage">

  <!-- 桌面小部件（常驻） -->
  <section class="win widget" id="winWidget">
    <div class="w-head drag">
      <span class="brand">咕咕<i></i></span>
      <span class="w-nav">
        <button class="ghost" id="mPrev">‹</button><b id="wMonth"></b><button class="ghost" id="mNext">›</button>
      </span>
    </div>
    <div class="mini-cal" id="miniCal"></div>
    <div class="w-div"></div>
    <div class="w-today-head"><b>今天 · 9月27日 周日</b><span class="w-count" id="wCount"></span></div>
    <div class="w-list" id="wList"></div>
    <div class="w-foot" id="wFoot"></div>
  </section>

  <!-- 唤出面板（编辑主界面） -->
  <section class="win panel" id="winPanel">
    <div class="p-top drag">
      <div class="quick">
        <span class="q-plus">+</span>
        <input id="quickInput" placeholder="添加任务：明天15:00 交周报 #工作 !重要" autocomplete="off">
        <span class="enter-hint">回车</span>
      </div>
      <div class="chips" id="chips"></div>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="today" class="on">今天</button>
      <button data-tab="week">周</button>
      <button data-tab="month">月</button>
    </nav>
    <div class="p-body">
      <div class="view view-today on" id="viewToday"><div class="tl" id="timeline"></div></div>
      <div class="view view-week" id="viewWeek"><div class="wk" id="wkGrid"></div></div>
      <div class="view view-month" id="viewMonth"><div class="month-grid" id="monthGrid"></div><div class="month-list" id="monthList"></div></div>
    </div>
    <footer class="p-foot"><span id="pFootL"></span><span>双击 Ctrl 呼出 · Esc 收起</span></footer>

    <!-- 新建任务小窗 -->
    <div class="pop-mask" id="popMask">
      <div class="addpop" role="dialog" aria-label="新建任务">
        <div class="f-head"><b>新建任务</b><button class="ghost" id="popClose" title="关闭">×</button></div>
        <div class="frow"><label class="f-label">任务</label><input class="f-in" id="fTitle" placeholder="要做什么？"></div>
        <div class="frow"><label class="f-label">截止</label>
          <select class="f-in sel" id="fDate"><option>今天</option><option>明天</option><option>后天</option><option>下周一</option></select>
          <input class="f-in time" id="fTime" type="time" value="16:30">
        </div>
        <div class="frow"><label class="f-label">标签</label><div class="fdots" id="fDots"></div></div>
        <div class="frow"><label class="f-label">提醒</label>
          <select class="f-in sel" id="fRemind" style="flex:1"><option>提前 10 分钟</option><option>准点</option><option>提前 30 分钟</option><option>提前 1 小时</option><option>不提醒</option></select>
        </div>
        <div class="f-foot"><span class="f-hint">回车添加 · Esc 取消</span>
          <span style="display:flex;gap:8px">
            <button class="btn gho" id="popCancel">取消</button>
            <button class="btn pri" id="popOk">＋ 添加</button>
          </span>
        </div>
      </div>
    </div>
  </section>

</main>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const q=new URLSearchParams(location.search);
if(q.get("clean"))document.body.classList.add("clean");
if(q.has("noanim"))document.body.classList.add("noanim");

/* ---------- 状态与参数 ---------- */
const state={
  theme:q.get("theme")||"celadon",
  mode:q.get("mode")||"light",
  alpha:q.get("alpha")||"0.8",
  blur:q.get("blur")!=="0",
  monthOffset:0, selDay:27,
};
document.body.dataset.theme=state.theme;
document.body.dataset.mode=state.mode;
document.body.style.setProperty("--glass-alpha",state.alpha);

/* ---------- 演示时间：默认跟随真实时钟，页面加载时不在 8:00–22:30 则用固定值 ---------- */
let NOWH, LIVE=!q.get("now");
if(q.get("now")){
  const [a,b]=q.get("now").split(":");
  NOWH=+a+ +b/60;
}else{
  const d=new Date(); const h=d.getHours()+d.getMinutes()/60;
  if(h<8||h>=22.5){NOWH=16+42/60;LIVE=false}else NOWH=h;
}
const pad=n=>String(Math.floor(n)).padStart(2,"0");
const hhmm=h=>{
  let H=Math.floor(h), M=Math.round((h-H)*60);
  if(M===60){H++;M=0}
  return `${pad(H)}:${pad(M)}`;
};

/* ---------- 数据（演示用） ---------- */
const TAGS={
  work:{l:"工作",c:"var(--c-work)"}, study:{l:"学习",c:"var(--c-study)"},
  life:{l:"生活",c:"var(--c-life)"}, health:{l:"健康",c:"var(--c-health)"},
  social:{l:"社交",c:"var(--c-social)"}, errand:{l:"杂务",c:"var(--c-errand)"},
};
/* SCHED：月视图/圆点的演示日程，键 "月-日" */
const SCHED={
  "9-3":[["09:30","实验室例会","work"]],
  "9-10":[["14:00","组会 · 文献分享","work"],["19:00","健身","health"]],
  "9-15":[["10:00","组会","work"]],
  "9-17":[["13:00","牙医预约","life"],["20:00","读书会","social"]],
  "9-21":[["10:00","项目评审","work"]],
  "9-24":[["16:00","取快递","errand"],["18:00","和老张吃饭","social"]],
  "9-27":[["08:00","晨跑 30 分钟","health"],["10:00","导师组会 · 汇报进展","work"],
          ["14:00","写实验报告 第三章","study"],["16:30","交周报","work"],
          ["19:00","代码评审","work"],["21:00","给妈妈打电话","life"]],
};
let uid=0; const T=o=>({id:++uid,gugu:false,...o});
const TASKS=[
  T({h:8, m:0, title:"晨跑 30 分钟", tag:"health", done:true}),
  T({h:10,m:0, title:"导师组会 · 汇报进展", tag:"work", done:true}),
  T({h:14,m:0, title:"写实验报告 第三章", tag:"study", done:false}),
  T({h:16,m:30,title:"交周报", tag:"work", done:false, remind:true}),
  T({h:19,m:0, title:"代码评审", tag:"work", done:false}),
  T({h:21,m:0, title:"给妈妈打电话", tag:"life", done:false}),
];
const BELL=`<svg class="bell" viewBox="0 0 24 24"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6 2 6H4s2-1 2-6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M10 19a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>`;
const CK=`<span class="ck${"" }"><svg viewBox="0 0 12 10"><path d="M1 5.2 4.2 8.4 11 1.6"/></svg></span>`;

const isOver=t=>!t.done&&(t.h+t.m/60)<NOWH;

/* ---------- 今天时间轴 ---------- */
const DAY0=8, DAY1=22.5, PXH=30;
function rowEl(t){
  const r=document.createElement("div");
  r.className="t-row"+(t.done?" done":"")+(isOver(t)?" overdue":"")+(t.gugu&&!t.done?" gugu":"");
  r.style.top=((t.h+t.m/60-DAY0)*PXH+8)+"px"; r.dataset.id=t.id;
  r.innerHTML=`
    <div class="t-card">
      <span class="t-t">${pad(t.h)}:${pad(t.m)}</span>
      <span class="t-title">${t.title}</span>
      <span class="tagpill" style="--tc:${TAGS[t.tag].c}">${TAGS[t.tag].l}</span>
      ${t.remind?BELL:""}
      <span class="pill-over">咕咕咕</span><span class="pill-gu">咕 → 明天</span>
      <span class="t-act"><button class="mini-btn" data-act="gu">咕了</button><button class="mini-btn ok" data-act="done">完成</button></span>
      <span class="ck${t.done?" on":""}"><svg viewBox="0 0 12 10"><path d="M1 5.2 4.2 8.4 11 1.6"/></svg></span>
    </div>`;
  return r;
}
function renderTimeline(){
  const tl=$("#timeline"); tl.innerHTML="";
  for(let h=8;h<=22;h+=2){
    const g=document.createElement("div"); g.className="tl-hour";
    g.style.top=((h-DAY0)*PXH+8)+"px"; g.innerHTML=`<b>${pad(h)}:00</b>`; tl.appendChild(g);
  }
  TASKS.forEach(t=>tl.appendChild(rowEl(t)));
  const nl=document.createElement("div"); nl.className="nowline"; nl.id="nowline";
  nl.innerHTML=`<i></i><b id="nowLbl"></b>`; tl.appendChild(nl);
  tl.style.height=((DAY1-DAY0)*PXH+16)+"px"; placeNow();
}
function placeNow(){
  const nl=$("#nowline"); if(!nl)return;
  nl.style.top=((NOWH-DAY0)*PXH+8)+"px";
  $("#nowLbl").textContent=`现在 ${hhmm(NOWH)}`;
}
function refreshRow(id){
  const t=TASKS.find(x=>x.id===id), row=$(`.t-row[data-id="${id}"]`); if(!row)return;
  row.classList.toggle("done",!!t.done);
  row.classList.toggle("overdue",isOver(t));
  row.classList.toggle("gugu",!!t.gugu&&!t.done);
  const ck=row.querySelector(".ck"); ck.classList.toggle("on",!!t.done);
}
$("#timeline").addEventListener("click",e=>{
  const row=e.target.closest(".t-row"); if(!row)return;
  const t=TASKS.find(x=>x.id==row.dataset.id); if(!t)return;
  if(e.target.closest(".ck")||e.target.closest('[data-act="done"]')){
    t.done=!t.done; if(t.done)t.gugu=false;
  }else if(e.target.closest('[data-act="gu"]')){
    t.gugu=true;
  }
  refreshRow(t.id); refreshCounts();
});
if(LIVE)setInterval(()=>{
  const d=new Date(); const h=d.getHours()+d.getMinutes()/60;
  if(h<8||h>=22.5)return; NOWH=h; placeNow(); TASKS.forEach(t=>refreshRow(t.id));
},1000);

/* ---------- 小部件列表 ---------- */
function renderWidgetList(){
  const list=$("#wList"); list.innerHTML="";
  const up=TASKS.filter(t=>!t.done).sort((a,b)=>a.h+a.m/60-b.h-b.m/60);
  up.slice(0,3).forEach(t=>{
    const d=document.createElement("div");
    d.className="w-row"+(isOver(t)?" overdue":"");
    d.innerHTML=`<span class="w-time">${pad(t.h)}:${pad(t.m)}</span><span class="w-title">${t.title}</span>
      ${isOver(t)?'<span class="w-gu">咕咕咕</span>':""}
      <span class="ck sm"><svg viewBox="0 0 12 10"><path d="M1 5.2 4.2 8.4 11 1.6"/></svg></span>`;
    d.querySelector(".ck").addEventListener("click",()=>{t.done=true;refreshRow(t.id);refreshCounts();});
    list.appendChild(d);
  });
  if(up.length>3){
    const m=document.createElement("div"); m.className="w-more";
    m.textContent=`还有 ${up.length-3} 个 · 双击 Ctrl 查看`; list.appendChild(m);
  }
}
function refreshCounts(){
  const done=TASKS.filter(t=>t.done).length, g=TASKS.filter(t=>t.gugu&&!t.done).length, n=TASKS.length;
  $("#wCount").textContent=`${done}/${n}`;
  $("#wFoot").textContent= done===n ? "都完成啦，今天很老实 ✓" : `还有 ${n-done} 个待办 · 咕了 ${g} 个`;
  $("#pFootL").textContent= done===n ? "全部老实了 ✓" : `今天 ${done}/${n} · 咕了 ${g} 个`;
  renderWidgetList();
}

/* ---------- 月历构建（小部件迷你月历 与 月视图共用） ---------- */
function buildMonth(el,big){
  const off=state.monthOffset, y=2026+Math.floor((8+off)/12), m=(8+off)%12+1;
  const start=(new Date(y,m-1,1).getDay()+6)%7;
  const dim=new Date(y,m,0).getDate(), prevDim=new Date(y,m-1,0).getDate();
  el.innerHTML="";
  "一二三四五六日".split("").forEach(w=>{
    const h=document.createElement("div"); h.className=big?"mo-w":"mc-w"; h.textContent=w; el.appendChild(h);
  });
  const cells=[];
  for(let i=start-1;i>=0;i--)cells.push({d:prevDim-i,out:1});
  for(let d=1;d<=dim;d++)cells.push({d});
  let nd=1; while(cells.length%7)cells.push({d:nd++,out:1});
  cells.forEach(c=>{
    const cell=document.createElement("div");
    cell.className=(big?"mo-d":"mc-d")+(c.out?" out":"");
    const isToday=off===0&&!c.out&&c.d===27;
    if(isToday)cell.classList.add("today");
    if(big&&!c.out){cell.dataset.d=c.d; if(c.d===state.selDay)cell.classList.add("sel");}
    const items=off===0&&!c.out?(SCHED[`9-${c.d}`]||[]):[];
    if(items.length){
      const dots=document.createElement("span"); dots.className=big?"mo-dots":"mc-dots";
      dots.innerHTML=items.slice(0,3).map(x=>`<i style="--tc:${TAGS[x[2]].c}"></i>`).join("");
      cell.appendChild(dots);
    }
    cell.insertAdjacentHTML("afterbegin",`<b>${c.d}</b>`);
    el.appendChild(cell);
  });
  $("#wMonth").textContent=`${y}年${m}月`;
}
function renderMonthList(d){
  const items=SCHED[`9-${d}`]||[];
  const wd="日一二三四五六"[new Date(2026,8,d).getDay()];
  $("#monthList").innerHTML=`<div class="ml-h">9月${d}日 · 周${wd}</div>`+
    (items.length?items.map(([tt,ti,tag])=>
      `<div class="ml-row"><b>${tt}</b><span>${ti}</span><i style="--tc:${TAGS[tag].c}">${TAGS[tag].l}</i></div>`).join("")
    :`<div class="ml-empty">这天还没有安排，双击 Ctrl 添加</div>`);
}

/* ---------- 周视图（演示数据） ---------- */
function renderWeek(){
  const dates=[21,22,23,24,25,26,27], HEAD=["一","二","三","四","五","六","日"];
  let html=`<div class="wk-h"><span></span>${dates.map((d,i)=>`<b class="${i===6?"today":""}">${HEAD[i]}<i>${d}</i></b>`).join("")}</div><div class="wk-body">`;
  for(let h=8;h<=22;h+=2)html+=`<i class="wl" style="top:${(h-DAY0)*PXH}px"><b>${pad(h)}</b></i>`;
  html+=`</div>`;
  const chips=[
    {c:0,h:10,m:0,title:"需求评审",tag:"work"},
    {c:1,h:19,m:0,title:"健身",tag:"health"},
    {c:2,h:10,m:0,title:"组会",tag:"work"},
    {c:2,h:15,m:0,title:"实验 · 数据",tag:"study"},
    {c:3,h:18,m:30,title:"部门聚餐",tag:"social"},
    {c:4,h:16,m:30,title:"交周报",tag:"work"},
    {c:6,h:8,m:0,title:"晨跑 30 分钟",tag:"health",done:1},
    {c:6,h:16,m:30,title:"交周报",tag:"work"},
  ];
  chips.forEach(p=>{
    html+=`<span class="wk-chip${p.done?" fin":""}" style="--tc:${TAGS[p.tag].c};left:calc(44px + ${p.c}*((100% - 44px)/7) + 3px);width:calc((100% - 44px)/7 - 8px);top:${(p.h+p.m/60-DAY0)*PXH + 26}px">${pad(p.h)}:${pad(p.m)} ${p.title}</span>`;
  });
  $("#wkGrid").innerHTML=html;
}

/* ---------- 快速添加：自然语言解析（演示版） ---------- */
function parseQuick(s){
  let date=null,time=null,pr=null; const tags=[];
  let str=s;
  str=str.replace(/#(\S+)/g,(_,g)=>{tags.push(g);return" "});
  str=str.replace(/!(\S+)/g,(_,g)=>{pr=g;return" "});
  str=str.replace(/(今天|明天|后天)/g,(_,g)=>{date=g;return" "});
  str=str.replace(/周([一二三四五六日天])/g,(_,g)=>{date="周"+g;return" "});
  str=str.replace(/([01]?\d|2[0-3])[:：]([0-5]\d)/g,(_,h,m)=>{time=`${pad(+h)}:${m}`;return" "});
  str=str.replace(/([01]?\d|2[0-3])点(半|[0-5]?\d?分?)/g,(_,h,m)=>{
    time=`${pad(+h)}:${m==="半"?"30":(m.replace("分","")||"00").padStart(2,"0")}`;return" "});
  return{date,time,pr,tags,title:str.replace(/\s+/g," ").trim()};
}
function renderChips(p){
  const box=$("#chips");
  if(!p||(!p.title&&!p.date&&!p.time&&!p.tags.length&&!p.pr)){box.innerHTML="";return;}
  let h="";
  if(p.date)h+=`<span class="chip">${p.date}</span>`;
  if(p.time)h+=`<span class="chip">${p.time}</span>`;
  p.tags.forEach(t=>h+=`<span class="chip tag" style="--tc:var(--c-errand)">#${t}</span>`);
  if(p.pr)h+=`<span class="chip pr">!${p.pr}</span>`;
  if(p.title)h+=`<span class="chip ttl">${p.title}</span>`;
  box.innerHTML=h;
}
const inp=$("#quickInput");
inp.addEventListener("input",()=>renderChips(parseQuick(inp.value)));
inp.addEventListener("keydown",e=>{
  if(e.key!=="Enter")return;
  const p=parseQuick(inp.value);
  if(!p.title&&!p.tags.length&&!p.time)return;
  openPop({title:p.title, date:p.date, time:p.time, tag:p.tags[0]});
});

/* ---------- 新建任务小窗 ---------- */
let popTag="errand";
const FDOTS=[["work","工作"],["study","学习"],["life","生活"],["health","健康"],["social","社交"],["errand","杂务"]];
function buildDots(){
  $("#fDots").innerHTML=FDOTS.map(([k,l])=>
    `<button class="fdot${k===popTag?" on":""}" data-k="${k}"><i style="--tc:${TAGS[k].c}"></i>${l}</button>`).join("");
}
$("#fDots").addEventListener("click",e=>{
  const b=e.target.closest(".fdot"); if(!b)return; popTag=b.dataset.k; buildDots();
});
function defaultTime(){return `${pad(Math.min(22,Math.floor(NOWH)+1))}:00`;}
function openPop(p={}){
  $("#popMask").classList.add("on");
  $("#fTitle").value=p.title||"";
  $("#fDate").value=["今天","明天","后天","下周一"].includes(p.date)?p.date:"今天";
  $("#fTime").value=p.time||defaultTime();
  popTag=p.tag&&TAGS[p.tag]?p.tag:"errand";
  buildDots();
  setTimeout(()=>$("#fTitle").focus(),40);
}
function closePop(){$("#popMask").classList.remove("on");}
function submitPop(){
  const title=$("#fTitle").value.trim();
  if(!title){$("#fTitle").focus();return;}
  const [h,m]=($("#fTime").value||defaultTime()).split(":").map(Number);
  const date=$("#fDate").value, remind=$("#fRemind").value;
  if(date==="今天"){
    const t=T({h,m,title,tag:popTag,done:false,remind:remind!=="不提醒"});
    TASKS.push(t);
    const rows=$$(".t-row");
    const next=rows.find(r=>{
      const ot=TASKS.find(x=>x.id==r.dataset.id); return ot&&(ot.h+ot.m/60)>(t.h+t.m/60);
    });
    $("#timeline").insertBefore(rowEl(t),next||$("#nowline"));
    refreshCounts(); placeNow();
  }else{
    $("#chips").innerHTML=`<span class="chip ok">已加入「${date}」</span>`;
  }
  closePop(); inp.value=""; renderChips(null);
}
$("#popOk").addEventListener("click",submitPop);
$("#popCancel").addEventListener("click",closePop);
$("#popClose").addEventListener("click",closePop);
$("#popMask").addEventListener("click",e=>{if(e.target===e.currentTarget)closePop();});
$("#fTitle").addEventListener("keydown",e=>{if(e.key==="Enter")submitPop();});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&$("#popMask").classList.contains("on")){e.stopPropagation();closePop();}
});
$(".q-plus").addEventListener("click",()=>openPop());
if(q.get("dialog"))openPop({title:"交周报",date:"今天",time:"16:30",tag:"work"});

/* ---------- 交互：主题 / 深浅 / 透明度 / 毛玻璃 ---------- */
$("#themePills").addEventListener("click",e=>{
  const b=e.target.closest(".pill"); if(!b)return;
  state.theme=b.dataset.themeSet; document.body.dataset.theme=state.theme;
  $$("#themePills .pill").forEach(x=>x.classList.toggle("on",x===b));
});
$("#modeSeg").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return;
  state.mode=b.dataset.modeSet; document.body.dataset.mode=state.mode;
  $$("#modeSeg button").forEach(x=>x.classList.toggle("on",x===b));
});
const al=$("#alpha");
al.value=state.alpha; $("#alphaVal").textContent=Math.round(state.alpha*100)+"%";
al.addEventListener("input",()=>{
  document.body.style.setProperty("--glass-alpha",al.value);
  $("#alphaVal").textContent=Math.round(al.value*100)+"%";
});
const bc=$("#blurChk");
bc.checked=state.blur; document.body.classList.toggle("no-blur",!state.blur);
bc.addEventListener("change",()=>document.body.classList.toggle("no-blur",!bc.checked));

/* ---------- 交互：页签 / 月历点选 / 月份切换 ---------- */
$("#tabs").addEventListener("click",e=>{
  const b=e.target.closest("button[data-tab]"); if(!b)return;
  $$("#tabs button[data-tab]").forEach(x=>x.classList.toggle("on",x===b));
  const id="view"+b.dataset.tab[0].toUpperCase()+b.dataset.tab.slice(1);
  $$(".view").forEach(v=>v.classList.toggle("on",v.id===id));
});
$("#monthGrid").addEventListener("click",e=>{
  const d=e.target.closest(".mo-d:not(.out)"); if(!d)return;
  state.selDay=+d.dataset.d;
  $$("#monthGrid .mo-d").forEach(x=>x.classList.toggle("sel",x===d));
  renderMonthList(state.selDay);
});
$("#mPrev").addEventListener("click",()=>{state.monthOffset--;buildMonth($("#miniCal"),false);buildMonth($("#monthGrid"),true);});
$("#mNext").addEventListener("click",()=>{state.monthOffset++;buildMonth($("#miniCal"),false);buildMonth($("#monthGrid"),true);});

/* ---------- 拖动窗口 ---------- */
function drag(win,handle){
  handle.addEventListener("pointerdown",e=>{
    if(e.target.closest("button,input,.ck"))return;
    const rect=win.getBoundingClientRect(),sx=e.clientX,sy=e.clientY,ol=rect.left,ot=rect.top;
    win.style.right="auto";
    const mv=ev=>{win.style.left=(ol+ev.clientX-sx)+"px";win.style.top=Math.max(8,ot+ev.clientY-sy)+"px";};
    const up=()=>{window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up);};
    window.addEventListener("pointermove",mv);window.addEventListener("pointerup",up);
  });
}
drag($("#winWidget"),$("#winWidget .w-head"));
drag($("#winPanel"),$("#winPanel .p-top"));

/* ---------- 初始化 ---------- */
buildMonth($("#miniCal"),false);
buildMonth($("#monthGrid"),true);
renderMonthList(state.selDay);
renderWeek();
renderTimeline();
refreshCounts();
</script>
</body>
</html>
