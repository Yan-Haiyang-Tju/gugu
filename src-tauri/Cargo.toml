[package]
name = "gugu"
version = "0.1.0"
description = "咕咕 · 常驻桌面的日历任务小部件"
authors = ["Yan-Haiyang"]
edition = "2021"

[lib]
name = "gugu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2.5.0"
tauri-plugin-autostart = "2.6.0"
tauri-plugin-single-instance = "2.5.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
chrono = { version = "0.4.45", features = ["serde"] }
# 只启用必需的 Win32 模块：windows crate 每多一个 feature 都会显著增加编译内存峰值
# （本机可用内存紧张，DWM/GDI/SystemInformation 等改为走 Tauri 提供的跨平台 API）
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_LibraryLoader"] }

# 依赖不需要调试符号：显著降低 rustc 内存峰值与构建时间
# （本机 16GB 内存且常驻占用较高，全量 debuginfo 会让编译进程 OOM）
[profile.dev.package."*"]
debug = false

# windows crate 会生成 45 个模块的海量代码，默认 256 个 codegen unit
# 会让 LLVM 起十几个并行线程，内存峰值高到本机编译崩溃（0xc0000409）。
# 限制到 4 个，用一点编译时间换编译能跑通。
[profile.dev.package.windows]
codegen-units = 4

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
